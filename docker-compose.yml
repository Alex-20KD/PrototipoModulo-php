x-app: &app
  env_file:
    - .env
  volumes:
    - ./:/var/www/html
    - vendor_data:/var/www/html/vendor
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s
  networks:
    - medtriaje

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    image: medtriaje-app:dev
    ports:
      - "${APP_PORT:-8080}:80"

  app2:
    <<: *app
    image: medtriaje-app:dev
    environment:
      RUN_MIGRATIONS: "false"
    ports:
      - "${APP2_PORT:-8081}:80"

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - medtriaje

  sftp:
    image: atmoz/sftp
    profiles: ["sftp"]
    ports:
      - "${SFTP_PORT:-2222}:22"

    command: ${SFTP_USERNAME:-medtriaje}:${SFTP_PASSWORD:-secret}:1001
    volumes:
      - sftp_data:/home/${SFTP_USERNAME:-medtriaje}/upload
    networks:
      - medtriaje

volumes:
  db_data:
  vendor_data:
  sftp_data:

networks:
  medtriaje:
    driver: bridge
